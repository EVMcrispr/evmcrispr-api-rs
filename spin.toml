spin_manifest_version = 2

[application]
name = "evmcrispr-api-rs"
version = "0.1.0"
authors = ["Sem <931684+sembrestels@users.noreply.github.com>"]
description = "Lightweight HTTP server for the EVMcrispr API"

[[trigger.http]]
route = "/cors-proxy/..."
component = "cors-proxy"

[component.cors-proxy]
source = "cors-proxy/target/wasm32-wasip1/release/cors_proxy.wasm"
allowed_outbound_hosts = [
    "https://*",
    # EEZ (Ethereum Economic Zone) hosted devnet: plain-http RPCs and
    # cross-chain ingress fronts, proxied so browsers and wallets can use them.
    "http://91.134.73.215:8545",
    "http://65.109.26.16:18688",
    "http://65.109.26.16:18999",
    "http://65.109.26.16:18998",
]
[component.cors-proxy.build]
command = "cargo build --target wasm32-wasip1 --release"
workdir = "cors-proxy"
watch = ["src/**/*.rs", "Cargo.toml"]

[component.cors-proxy.environment]
ALLOWED_ORIGINS = "*"
ALLOWED_TARGET_DOMAINS = "https://mainnet.serve.giveth.io/graphql,https://auth.giveth.io/v1,https://api.gelato.digital/automate/users/users/web3-function,https://api.gelato.digital/1balance,http://91.134.73.215:8545,http://65.109.26.16:18688,http://65.109.26.16:18999,http://65.109.26.16:18998"

[[trigger.http]]
route = "/tokenlist/..."
component = "tokenlist"

[component.tokenlist]
source = "tokenlist/target/wasm32-wasip1/release/tokenlist.wasm"
allowed_outbound_hosts = ["https://api.coingecko.com", "https://tokens.coingecko.com"]
key_value_stores = ["default"]
[component.tokenlist.build]
command = "cargo build --target wasm32-wasip1 --release"
workdir = "tokenlist"
watch = ["src/**/*.rs", "Cargo.toml"]

[[trigger.http]]
route = "/abi/..."
component = "abi-fetcher"

[component.abi-fetcher]
source = "abi-fetcher/target/wasm32-wasip1/release/abi_fetcher.wasm"
allowed_outbound_hosts = [
    "https://api.etherscan.io",
    "https://eth.blockscout.com",
    "https://optimism.blockscout.com",
    "https://gnosis.blockscout.com",
    "https://arbitrum.blockscout.com",
    "https://base.blockscout.com",
]
key_value_stores = ["default"]
[component.abi-fetcher.build]
command = "cargo build --target wasm32-wasip1 --release"
workdir = "abi-fetcher"
watch = ["src/**/*.rs", "Cargo.toml"]

[[trigger.http]]
route = "/search"
component = "tavily-search"

[[trigger.http]]
route = "/extract"
component = "tavily-search"

[component.tavily-search]
source = "tavily-search/target/wasm32-wasip1/release/tavily_search.wasm"
allowed_outbound_hosts = ["https://api.tavily.com"]
[component.tavily-search.build]
command = "cargo build --target wasm32-wasip1 --release"
workdir = "tavily-search"
watch = ["src/**/*.rs", "Cargo.toml"]

[[trigger.http]]
route = "/experimental-eez-rpc/..."
component = "experimental-eez-rpc"

[component.experimental-eez-rpc]
source = "experimental-eez-rpc/target/wasm32-wasip1/release/experimental_eez_rpc.wasm"
# EEZ devnet execution RPCs and cross-chain fronts (plain http).
allowed_outbound_hosts = [
    "http://91.134.73.215:8545",
    "http://65.109.26.16:18688",
    "http://65.109.26.16:18999",
    "http://65.109.26.16:18998",
]
[component.experimental-eez-rpc.build]
command = "cargo build --target wasm32-wasip1 --release"
workdir = "experimental-eez-rpc"
watch = ["src/**/*.rs", "Cargo.toml"]

[component.experimental-eez-rpc.environment]
# key=chainId,executionRpc,front;...
EEZ_CHAINS = "eezL1=7331,http://91.134.73.215:8545,http://65.109.26.16:18999;eezL2=6290,http://65.109.26.16:18688,http://65.109.26.16:18998"

[variables]
etherscan_api_key = { required = true }
tavily_api_key = { required = true }

[component.tavily-search.variables]
tavily_api_key = "{{ tavily_api_key }}"

[component.abi-fetcher.variables]
etherscan_api_key = "{{ etherscan_api_key }}"
