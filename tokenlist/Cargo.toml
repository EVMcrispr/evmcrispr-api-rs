[package]
name = "tokenlist"
authors = ["Sem <931684+sembrestels@users.noreply.github.com>"]
description = "Token List API mixing Coingecko and Superfluid"
version = "0.1.0"
rust-version = "1.78"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
spin-sdk = "5.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[workspace]
