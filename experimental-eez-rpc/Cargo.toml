[package]
name = "experimental-eez-rpc"
authors = ["Sem <931684+sembrestels@users.noreply.github.com>"]
description = "One JSON-RPC endpoint per EEZ chain that routes cross-chain transactions to the front"
version = "0.1.0"
rust-version = "1.78"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
spin-sdk = "5.0.0"
serde_json = "1"
alloy-consensus = { version = "2", default-features = false, features = ["k256"] }
alloy-primitives = { version = "1", default-features = false }
alloy-rlp = "0.3"

[workspace]
